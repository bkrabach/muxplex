# muxplex tmux base configuration
# Managed by muxplex. Your own overrides go in 90-local.conf (never touched).
#
# WHO THIS IS FOR
# muxplex users drive sessions from the web dashboard -- creating windows,
# switching sessions, and splitting panes are all things the UI does. Almost
# nobody arrives here as a tmux user, and most are desktop users everywhere
# else. So this file optimises for the terminal *content* behaving the way a
# desktop app behaves -- mouse works, selection works, copy works, scrollback
# is deep -- and NOT for teaching tmux keybindings.
#
# The bar for anything below: would someone who has never heard of tmux be
# surprised by it? If yes, it does not belong in the default.

# ---- Terminal & color ----
# Load sentinel -- muxplex reads this to prove the fragment was sourced.
set -g @muxplex_loaded "base-2"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*-256color:Tc"
set -as terminal-features ",xterm-256color:extkeys"

# ---- Behavior ----
# Mouse: not a preference here. Without it, clicking a pane, scrolling back,
# and dragging a border to resize all silently do nothing, which reads as a
# broken terminal to anyone expecting desktop behaviour.
set -g mouse on
set -g history-limit 50000
# tmux ships escape-time 500, which makes Esc feel laggy in anything that
# distinguishes Esc from an escape sequence (vim, less, fzf, TUI installers).
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g extended-keys on

# ---- Clipboard (OSC 52; works over SSH) ----
set -g set-clipboard on

# ---- Selection ----
# Double-click selects a "word". tmux's default separators break on / . - _
# so double-clicking a path, a filename, or a package name grabs a fragment
# instead of the thing you pointed at. These separators keep those intact.
set -g word-separators " ()[]{}'\",;:|<>"

# ---- Titles ----
set -g set-titles on
if-shell '[ -n "$SSH_CONNECTION" ]' \
    'set -g set-titles-string "#H: #S"' \
    'set -g set-titles-string "#S"'

# ---- Indexing ----
# Windows and panes count from 1. tmux counts from 0; humans do not, and the
# dashboard shows these numbers.
set -g base-index 1
setw -g pane-base-index 1
# Close a middle window and the rest close the gap, like browser tabs.
set -g renumber-windows on

# ---- Copy mode ----
# emacs, not vi. In vi copy-mode the arrow keys are the *least* useful way to
# move, selection is modal (`v` to start, `y` to finish), and there is no
# indication anywhere on screen that a mode exists. In emacs copy-mode the
# arrows, PageUp/PageDown, and Home/End all do the obvious thing, which is
# what someone reaching for the keyboard after scrolling will try first.
setw -g mode-keys emacs

# Drag to select, release to copy -- and the selection lands on the system
# clipboard via OSC 52, so Cmd/Ctrl+V works in other apps.
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel

# Ctrl+C copies the selection. This is the single most-tried shortcut by
# someone who just highlighted text, and without it the answer would be
# Alt+w -- which nobody guesses.
bind -T copy-mode C-c send -X copy-selection-and-cancel

# Esc leaves copy mode. Scrolling up silently enters it, so there must be an
# obvious way back out; without this, "my typing stopped working" is the
# common report.
bind -T copy-mode Escape send -X cancel

# ---- Pane navigation (no prefix) ----
# Alt+arrows. Discoverable by trying it, and the direction is self-evident.
# (Vim-style Alt+hjkl is deliberately NOT here -- it is muscle memory this
# audience does not have. Anyone who wants it can add it to 90-local.conf.)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---- Window navigation ----
# Shift+arrows, matching the browser-tab gesture people already know.
bind -n S-Left  previous-window
bind -n S-Right next-window
