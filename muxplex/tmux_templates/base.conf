# muxplex tmux base configuration
# Managed by muxplex. Your own overrides go in 90-local.conf (never touched).

# ---- Terminal & color ----
# Load sentinel -- muxplex reads this to prove the fragment was sourced.
set -g @muxplex_loaded "base-1"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,*-256color:Tc"
set -as terminal-features ",xterm-256color:extkeys"

# ---- Behavior ----
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g extended-keys on

# ---- Clipboard (OSC 52; works over SSH) ----
set -g set-clipboard on

# ---- Titles ----
set -g set-titles on
if-shell '[ -n "$SSH_CONNECTION" ]' \
    'set -g set-titles-string "#H: #S"' \
    'set -g set-titles-string "#S"'

# ---- Indexing ----
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---- Copy mode ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ---- Pane navigation (no prefix) ----
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ---- Window navigation ----
bind -n S-Left  previous-window
bind -n S-Right next-window
