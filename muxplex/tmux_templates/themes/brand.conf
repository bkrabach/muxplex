# muxplex theme: brand
#
# Built from muxplex's own UI tokens (frontend/style.css) so the tmux status bar
# and the muxplex web dashboard read as one product:
#
#   --bg          #0D1117   base background
#   --bg-tile     #10131C   elevated
#   --bg-surface  #1A1F2B   surface / hover
#   --text        #F0F6FF   primary text
#   --text-muted  #8E95A3   secondary text
#   --text-dim    #4A5060   disabled text
#   --border      #2A3040   default border
#   --accent      #00D9F5   brand cyan  -> active / selected
#   --bell        #F1A640   brand amber -> bell / activity
#
# The payoff: a window with a bell turns the SAME amber in your terminal that
# its tile turns in the muxplex dashboard. One signal, one colour, two surfaces.

# ---- Status bar canvas: base background, secondary-text foreground ----------
set -g status-style "bg=#0D1117,fg=#8E95A3"

# ---- Session badge: solid brand cyan. The "you are here" identity marker. ---
set -g status-left "#[bg=#00D9F5,fg=#0D1117,bold] #S #[bg=#0D1117] "
set -g status-left-length 30

# ---- Right: cwd in dim text, then host + clock lifted onto the surface tone -
set -g status-right "#[fg=#4A5060]#{pane_current_path}  #[bg=#1A1F2B,fg=#8E95A3] #H #[bg=#1A1F2B,fg=#00D9F5,bold]%H:%M "
set -g status-right-length 120

# ---- Windows: inactive sits on elevated bg, current lifts to surface + cyan -
set -g window-status-format "#[bg=#10131C,fg=#8E95A3] #I #W "
set -g window-status-current-format "#[bg=#1A1F2B,fg=#00D9F5,bold] #I #W "
set -g window-status-separator ""

# ---- Bell + activity: muxplex's own amber, identical to the dashboard ------
set -g window-status-bell-style "bg=#F1A640,fg=#0D1117,bold"
set -g window-status-activity-style "bg=#10131C,fg=#F1A640"

# ---- Panes: default border, cyan on the focused one ------------------------
set -g pane-border-style "fg=#2A3040"
set -g pane-active-border-style "fg=#00D9F5"

# ---- Messages, prompts, copy mode -----------------------------------------
set -g message-style "bg=#1A1F2B,fg=#F0F6FF"
set -g message-command-style "bg=#1A1F2B,fg=#00D9F5"
set -g mode-style "bg=#00D9F5,fg=#0D1117"
