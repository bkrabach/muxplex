# muxplex theme: brand
#
# Built from muxplex's own UI tokens (frontend/style.css) so the tmux status bar
# and the muxplex web dashboard read as one product:
#
#   --bg          #0D1117   base background
#   --bg-tile     #10131C   elevated
#   --bg-surface  #1A1F2B   surface / hover
#   --text        #F0F6FF   primary text
#   --text-muted  #8E95A3   secondary text
#   --border      #2A3040   default border
#   --accent      #00D9F5   brand cyan  -> active / selected
#   --bell        #F1A640   brand amber -> bell / activity
#
# The payoff: a window with a bell turns the SAME amber in your terminal that
# its tile turns in the muxplex dashboard. One signal, one colour, two surfaces.
#
# TWO RULES THIS FILE EXISTS TO OBEY, both learned the hard way:
#
#  1. EVERY SEGMENT PAINTS ITS OWN BACKGROUND. A terminal cell's background
#     fills the whole cell including the line-height leading, so a segment with
#     a background reads as a padded "cell" and one without reads as bare text
#     floating on the bar. Mixing the two looks broken -- the padded one appears
#     to have vertical padding the others lack. Any colour used here must be far
#     enough from --bg to actually register: #10131C is only 10 RGB-steps from
#     #0D1117 and is invisible in practice.
#
#  2. STATUS-RIGHT MUST STAY SHORT AND BOUNDED. tmux gives the window list
#     whatever columns status-left and status-right do not take. A full
#     #{pane_current_path} is unbounded, so on a deep path or a narrow client it
#     pushes windows behind the ">" truncation marker -- and a window past ">"
#     has no mouse range, so clicking its label does nothing. That is not a
#     broken binding; it is a window that is not on screen to be clicked.
#     Use the basename and keep status-right-length modest.

# ---- Status bar canvas ----------------------------------------------------
set -g status-style "bg=#0D1117,fg=#8E95A3"

# ---- Session badge: solid brand cyan. The "you are here" identity marker. ---
set -g status-left "#[bg=#00D9F5,fg=#0D1117,bold] #S #[bg=#0D1117] "
set -g status-left-length 24

# ---- Right: filled cells, basename only, bounded so windows keep their room -
set -g status-right "#[bg=#1A1F2B,fg=#8E95A3] #{b:pane_current_path} #[bg=#0D1117] #[bg=#1A1F2B,fg=#F0F6FF] #H #[bg=#0D1117] #[bg=#00D9F5,fg=#0D1117,bold] %H:%M "
set -g status-right-length 60

# ---- Windows: every cell filled, one space of bar between them --------------
set -g window-status-format "#[bg=#1A1F2B,fg=#8E95A3] #I #W #[bg=#0D1117] "
set -g window-status-current-format "#[bg=#00D9F5,fg=#0D1117,bold] #I #W #[bg=#0D1117] "
set -g window-status-separator ""

# ---- Bell + activity: muxplex's own amber, identical to the dashboard ------
set -g window-status-bell-style "bg=#F1A640,fg=#0D1117,bold"
set -g window-status-activity-style "bg=#2A3040,fg=#F1A640"

# ---- Panes: default border, cyan on the focused one ------------------------
set -g pane-border-style "fg=#2A3040"
set -g pane-active-border-style "fg=#00D9F5"

# ---- Messages, prompts, copy mode -----------------------------------------
set -g message-style "bg=#1A1F2B,fg=#F0F6FF"
set -g message-command-style "bg=#1A1F2B,fg=#00D9F5"
set -g mode-style "bg=#00D9F5,fg=#0D1117"
