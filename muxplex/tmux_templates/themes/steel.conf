# muxplex theme: steel -- the palette inherited from the retired amplifier-cli-tools.
# Follows the same two rules as brand.conf: every segment paints its own
# background, and status-right stays short and bounded so the window list keeps
# the columns it needs to remain clickable.
set -g status-style "bg=#333333,fg=#bbbbbb"

set -g status-left "#[bg=#5f87af,fg=#000000,bold] #S #[bg=#333333] "
set -g status-left-length 24

set -g status-right "#[bg=#444444,fg=#bbbbbb] #{b:pane_current_path} #[bg=#333333] #[bg=#444444,fg=#ffffff] #H #[bg=#333333] #[bg=#5f87af,fg=#000000,bold] %H:%M "
set -g status-right-length 60

set -g window-status-format "#[bg=#444444,fg=#bbbbbb] #I #W #[bg=#333333] "
set -g window-status-current-format "#[bg=#5f87af,fg=#000000,bold] #I #W #[bg=#333333] "
set -g window-status-separator ""

set -g window-status-bell-style "bg=#d7875f,fg=#000000,bold"
set -g window-status-activity-style "bg=#5f5f5f,fg=#d7875f"

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#5f87af"

set -g message-style "bg=#444444,fg=#ffffff"
set -g message-command-style "bg=#444444,fg=#5f87af"
set -g mode-style "bg=#5f87af,fg=#000000"
