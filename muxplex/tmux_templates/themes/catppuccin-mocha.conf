# muxplex theme: catppuccin-mocha
# Follows the same two rules as brand.conf: every segment paints its own
# background, and status-right stays short and bounded so the window list keeps
# the columns it needs to remain clickable.
set -g status-style "bg=#1e1e2e,fg=#a6adc8"

set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-left-length 24

set -g status-right "#[bg=#313244,fg=#cdd6f4] #H #[bg=#1e1e2e] #[bg=#b4befe,fg=#1e1e2e,bold] %I:%M %p "
set -g status-right-length 40

set -g window-status-format "#[bg=#313244,fg=#a6adc8] #I #W #[bg=#1e1e2e] "
set -g window-status-current-format "#[bg=#b4befe,fg=#1e1e2e,bold] #I #W #[bg=#1e1e2e] "
set -g window-status-separator ""

set -g window-status-bell-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g window-status-activity-style "bg=#45475a,fg=#f9e2af"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"

set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#b4befe"
set -g mode-style "bg=#b4befe,fg=#1e1e2e"
