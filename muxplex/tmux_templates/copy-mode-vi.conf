# vi-style copy-mode, rendered by muxplex when settings.tmux_copy_mode == "vi".
# Managed by muxplex -- see ~/.config/muxplex/tmux.d/30-copy-mode.conf's
# generation in tmux_config.render_fragments(). Loads after the base (10) and
# theme (20) fragments so it can override tmux's default mode-keys, and before
# the user's own 90-local.conf so anything the user sets there still wins.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
