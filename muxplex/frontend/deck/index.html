<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- No user-scalable=no / maximum-scale=1 (deliberate deviation from the
       root app's index.html — DESIGN_RESPONSIVE.md §4.1): iOS Safari has
       ignored user-scalable=no since iOS 10, so keeping it only buys
       platform divergence, and it's a WCAG 1.4.4 failure. The real hazard
       (accidental double-tap zoom) is handled by touch-action:manipulation
       on tiles instead. viewport-fit=cover is mandatory or every
       env(safe-area-inset-*) below resolves to 0px. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Muxplex Deck" />
  <link rel="manifest" href="/deck/manifest.json" />
  <!-- iOS ignores manifest icons entirely (DESIGN_RESPONSIVE.md §4.5) --
       needs its own apple-touch-icon link or it silently falls back to the
       root app's icon. Judgment call: reusing the root app's icon art
       rather than commissioning distinct glyph art for v1 (SOFT_DECK_
       DESIGN.md OQ4 explicitly names this as the fallback when distinct art
       isn't produced); the two installed icons remain distinguishable by
       name/short_name even though the glyph is shared. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="stylesheet" href="/deck/deck.css" />
  <title>muxplex deck</title>
</head>
<body>
  <div id="deck-root">
    <!-- A fixed R x C grid of keys, sized and populated entirely by deck.js
         (DESIGN_SOFTDECK.md \u00a71.3). No header, no scroll container, no
         slide-up sheet -- everything reachable is visible right now, exactly
         like the hardware. -->
    <div id="deck-surface">
      <div id="deck-grid" role="list" aria-label="deck keys"></div>
    </div>

    <!-- Emulated dial strip (BACKLOG.md item 2) -- hidden (dialCount=0) by
         default; deck.js toggles this and populates it with `.deck-dial`
         elements per the configured dialCount. -->
    <div id="deck-dial-strip" class="hidden" role="list" aria-label="deck dials"></div>

    <!-- Whole-surface takeover for the disconnected state (identical
         mechanism to the view picker, \u00a77) -- shown instead of the grid,
         never alongside it. -->
    <div id="deck-disconnected" class="hidden">
      <p id="deck-disconnected-message"></p>
      <button type="button" id="deck-retry">RETRY</button>
    </div>

    <!-- Settings panel (BACKLOG.md item 2). Reached via a long-press on the
         VIEW control key, or the ?settings=1 / ?reset=1 URL escape hatch
         (deck.js's checkURLEscapeHatch) -- never a default key slot. This is
         the one element on the surface allowed to scroll (deck.css). -->
    <div id="deck-settings" class="hidden">
      <button type="button" id="settings-close">&larr; BACK</button>
      <h1>Deck Settings</h1>

      <section>
        <h2>Session order</h2>
        <label>Sort
          <select id="settings-sort">
            <option value="attention">Attention (needs-attention first)</option>
            <option value="server">Server (dashboard's own order)</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Polling</h2>
        <label>Poll interval (ms)
          <input type="number" id="settings-poll" min="500" max="60000" step="100" />
        </label>
      </section>

      <section>
        <h2>Grid layout</h2>
        <p>Per-device key grid override. Leave blank for automatic (viewport-derived) sizing.</p>
        <label>Rows <input type="number" id="settings-rows" min="1" max="12" /></label>
        <label>Cols <input type="number" id="settings-cols" min="1" max="12" /></label>
        <button type="button" id="settings-grid-auto">Auto</button>
      </section>

      <section>
        <h2>Dials</h2>
        <label>Dial count (0-4)
          <input type="number" id="settings-dial-count" min="0" max="4" />
        </label>
      </section>

      <section>
        <h2>Brightness</h2>
        <label>Brightness (10-100%)
          <input type="range" id="settings-brightness" min="10" max="100" />
        </label>
      </section>

      <section>
        <h2>Key/dial bindings</h2>
        <p>Address form: <code>key.N</code>, <code>dial.N.turn</code>, <code>dial.N.push</code>.</p>
        <div id="settings-bindings-list"></div>
        <div class="settings-add-binding">
          <input type="text" id="settings-add-address" placeholder="key.3" />
          <select id="settings-add-action"></select>
          <button type="button" id="settings-add-binding">Add</button>
        </div>
        <p id="settings-add-error" class="settings-error"></p>
      </section>

      <section>
        <h2>Export</h2>
        <textarea id="settings-export" readonly rows="6"></textarea>
        <button type="button" id="settings-export-copy">Copy</button>
      </section>

      <section>
        <h2>Import</h2>
        <textarea id="settings-import" rows="6" placeholder="Paste exported settings JSON here"></textarea>
        <button type="button" id="settings-import-apply">Apply</button>
        <p id="settings-import-error" class="settings-error"></p>
      </section>

      <section>
        <button type="button" id="settings-reset">Reset to defaults</button>
      </section>
    </div>
  </div>

  <script src="/deck/deck.js"></script>
</body>
</html>
