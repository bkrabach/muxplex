[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxplex-client"
version = "0.40.1"
description = "Typed sync/async HTTP client for the muxplex API"
readme = "README.md"
license = { text = "MIT" }
authors = [{name = "Brian Krabach", email = "brian@krabach.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
keywords = ["tmux", "muxplex", "client", "http", "api"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

# NOTE: no dependency on `muxplex` (the server package). This distribution
# must remain installable with httpx alone -- see ../muxplex-client-design.md
# §1 for why (a server dependency would drag in fastapi/uvicorn/python-pam
# and, worse, install a `muxplex` server console script on a client machine).

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/bkrabach/muxplex"
Issues = "https://github.com/bkrabach/muxplex/issues"

[tool.hatch.build.targets.wheel]
packages = ["muxplex_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
