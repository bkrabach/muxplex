[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxplex"
version = "0.47.10"
description = "Web-based tmux session dashboard — access all your tmux sessions from any browser"
readme = "README.md"
license = { text = "MIT" }
authors = [{name = "Brian Krabach", email = "brian@krabach.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
]
keywords = ["tmux", "terminal", "dashboard", "web", "session-manager"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiofiles>=23.0",
    "websockets>=14.0",  # unix_connect() (websockets.asyncio.client) requires >=14.0 --
                         # see docs/plans/2026-08-02-per-session-ttyd-plan.md §0.4. Not the version floor
                         # AGENTS.md's uvicorn/websockets incident deliberately rejected
                         # (that was about forcing one implementation for one bug; this is
                         # a hard API requirement -- below 14.0 the import fails outright).
    "python-pam>=1.8.4",
    "six>=1.16.0",              # undeclared dep of python-pam (needed on macOS clean envs)
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography",
    # The tmux session-management core now lives in its OWN repo/PyPI
    # project, bkrabach/tmux-kit (docs/plans/2026-08-09-tmuxkit-own-repo-
    # and-pypi-plan.md SS3-SS5). This is a PLAIN version pin, which is
    # what enters Requires-Dist: PyPI rejects direct-URL deps in
    # Requires-Dist, so a project-level git source never enters the
    # published wheel regardless of what [tool.uv.sources] says below --
    # verified by inspecting a built wheel's METADATA (v0.45.1 release
    # evidence). A public `uv tool install muxplex` therefore always
    # resolves tmux-kit from PyPI, exactly as before.
    #
    # Pin discipline: exact `==`, bumped deliberately at release time after
    # the corresponding tmux-kit version is verified compatible (SS4, SS9
    # prices the two-repo release dance this now costs). `muxplex doctor`
    # reports tmux-kit's installed version/source and warns on drift from
    # this pin; `muxplex upgrade` reconstructs a git-sourced `--with`
    # override from this pin at upgrade time (cli.py's
    # _read_remote_tmux_kit_pin/_resolve_upgrade_kit_ref).
    "tmux-kit==0.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
muxplex = "muxplex.cli:main"

[project.urls]
Repository = "https://github.com/bkrabach/muxplex"
Issues = "https://github.com/bkrabach/muxplex/issues"

[tool.hatch.build.targets.wheel]
packages = ["muxplex"]
exclude = ["muxplex/tests", "muxplex/frontend/tests"]

[tool.pytest.ini_options]
testpaths = ["muxplex/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: marks tests as integration tests requiring real tmux (deselect with '-m not integration')",
    "allow_real_port_killer: test intentionally exercises the real _kill_stale_port_holder (see tests/conftest.py)",
    "allow_real_service_ready_wait: test intentionally exercises the real _wait_for_service_ready (see tests/conftest.py)",
    # NOTE: the 'differential' marker/harness retired from this repo at the
    # tmux-kit cutover (docs/plans/2026-08-09-tmuxkit-own-repo-and-pypi-plan.md
    # SS3.2/SS5): the harness tests tmux-kit's own internals and now lives,
    # byte-identical, in bkrabach/tmux-kit's own suite (run there via
    # 'pytest -m differential'). test_tmux_kit_contract.py is this repo's
    # replacement tripwire for cross-repo drift.
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    # Workspace-editable, dev-only. NEVER a runtime dependency of the server
    # (see client/pyproject.toml and muxplex-client-design.md §1/§7) --
    # needed here only so muxplex/tests/test_client_contract.py can import
    # muxplex_client and drive it over httpx.ASGITransport against the real
    # app in-process.
    "muxplex-client",
]

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
muxplex-client = { workspace = true }
# v0.45.1: a committed git source for tmux-kit, pinned to the tag matching
# the `==` pin above. This REVERSES the v0.45.0 design note that used to
# sit here (which argued a project-level source was pointless/dangerous)
# after empirically disproving its premise -- see AGENTS.md's "tmux-kit
# pin/tag agreement" section for the full account. Two things are true at
# once, both verified by building a real wheel and running a real
# `uv tool install`:
#
#   1. This entry NEVER enters Requires-Dist. `[project.dependencies]`'s
#      plain `tmux-kit==X.Y.Z` is the only thing PyPI's wheel metadata
#      carries -- a public `uv tool install muxplex` still resolves
#      tmux-kit from PyPI, unaffected by this line.
#   2. `uv tool install git+https://github.com/bkrabach/muxplex@vX` DOES
#      honor this entry (once `uv lock` has regenerated `uv.lock` to
#      record the git source -- see below) -- confirmed via
#      tmux_kit-*.dist-info/direct_url.json showing `vcs_info` with the
#      resolved commit. A managed (CISO) device therefore gets tmux-kit
#      from git automatically on a git-sourced muxplex install, with no
#      hand-typed `--with` override required.
#
# LOAD-BEARING CAVEAT, empirically discovered building this release: a git
# tool install resolves tmux-kit from whatever `uv.lock` (committed in this
# repo) already records for it -- NOT a fresh ad-hoc re-resolve of this
# pyproject.toml. Editing this entry without immediately running `uv lock`
# and committing the result leaves `uv.lock` pointing at the OLD source
# (e.g. still `registry`), and the git installer silently keeps resolving
# from PyPI as if this entry did not exist. Always `uv lock` (and diff
# uv.lock's tmux-kit `source = {...}` line) in the same commit as any
# change here.
#
# `tag` MUST equal `v` + the version in the `tmux-kit==` pin above --
# CI's guard-tmux-kit-pin-source-agreement job and
# test_tmux_kit_pin_source_agreement.py both fail the build/suite if they
# drift. A `path` source here (the cross-repo dev loop's `uv add --editable
# ../tmux-kit`) must be reverted before committing -- the guard rejects it.
tmux-kit = { git = "https://github.com/bkrabach/tmux-kit", tag = "v0.3.5" }
