[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxplex"
version = "0.42.0"
description = "Web-based tmux session dashboard — access all your tmux sessions from any browser"
readme = "README.md"
license = { text = "MIT" }
authors = [{name = "Brian Krabach", email = "brian@krabach.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
]
keywords = ["tmux", "terminal", "dashboard", "web", "session-manager"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiofiles>=23.0",
    "websockets>=14.0",  # unix_connect() (websockets.asyncio.client) requires >=14.0 --
                         # see docs/plans/2026-08-02-per-session-ttyd-plan.md §0.4. Not the version floor
                         # AGENTS.md's uvicorn/websockets incident deliberately rejected
                         # (that was about forcing one implementation for one bug; this is
                         # a hard API requirement -- below 14.0 the import fails outright).
    "python-pam>=1.8.4",
    "six>=1.16.0",              # undeclared dep of python-pam (needed on macOS clean envs)
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
muxplex = "muxplex.cli:main"

[project.urls]
Repository = "https://github.com/bkrabach/muxplex"
Issues = "https://github.com/bkrabach/muxplex/issues"

[tool.hatch.build.targets.wheel]
packages = ["muxplex"]
exclude = ["muxplex/tests", "muxplex/frontend/tests"]

[tool.pytest.ini_options]
testpaths = ["muxplex/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: marks tests as integration tests requiring real tmux (deselect with '-m not integration')",
    "allow_real_port_killer: test intentionally exercises the real _kill_stale_port_holder (see tests/conftest.py)",
    "allow_real_service_ready_wait: test intentionally exercises the real _wait_for_service_ready (see tests/conftest.py)",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
    # Workspace-editable, dev-only. NEVER a runtime dependency of the server
    # (see client/pyproject.toml and muxplex-client-design.md §1/§7) --
    # needed here only so muxplex/tests/test_client_contract.py can import
    # muxplex_client and drive it over httpx.ASGITransport against the real
    # app in-process.
    "muxplex-client",
]

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
muxplex-client = { workspace = true }
