# Drop-in: /etc/systemd/system/amplifier-agent-http.service.d/fence.conf
#
# Makes "the sidecar cannot reach muxplex" a start condition rather than a
# convention. Three independent locks, because the failure this closes is
# specifically the one that degrades SILENTLY:
#
#   Requires=  -- boot/normal start: no fence unit, no sidecar.
#   BindsTo=   -- runtime: if the fence unit is stopped or goes failed
#                 (the watchdog timer marks it so), systemd stops the
#                 sidecar too, without anyone having to notice.
#   ExecStartPre= -- covers the manual path Requires= does not: an operator
#                 typing `systemctl start amplifier-agent-http` on a box
#                 where the fence unit is nominally "active" but the rules
#                 have been flushed underneath it. The verify re-proves the
#                 property from scratch and refuses to start on failure.
#
# There is deliberately no timeout-and-continue, no warn-and-proceed, and no
# environment variable that turns this off.

[Unit]
Requires=muxplex-agent-fence.service
After=muxplex-agent-fence.service
BindsTo=muxplex-agent-fence.service

[Service]
# The leading '+' runs this as root, ignoring the unit's User=aa-svc. Without
# it the check inherits the sidecar's own unprivileged identity, cannot read
# iptables or sudo to probe, and fails for the wrong reason -- which would
# have been an outage disguised as a security finding.
ExecStartPre=+/usr/local/sbin/muxplex-agent-fence verify
