# /etc/muxplex-agent-fence.conf
#
# Config for the agent-sidecar network fence. See
# /usr/local/sbin/muxplex-agent-fence and docs/AGENT_CHAT_SIDECAR.md.
#
# The applier uses this list verbatim (deterministic, auditable). The
# verifier does NOT trust it -- it independently discovers every port a live
# muxplex is listening on and FAILS if one is missing from here. So adding a
# muxplex instance on a new port breaks the build loudly instead of silently
# opening a hole.

# OS user the sidecar runs as.
AA_USER=aa-svc

# Every port a muxplex serves on this box. Comma-separated.
#   8088 -- primary instance (0.0.0.0:8088)
#   8188 -- second instance  (127.0.0.1:8188)
MUXPLEX_PORTS=8088,8188

# Ports on which the local DNS stub resolver is allowed. This is the only
# local service the sidecar may initiate a connection to; without it the
# sidecar cannot resolve its upstream model API and the chat panel dies.
DNS_STUB_PORTS=53
