name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read   # Required for actions/checkout
  id-token: write  # Required for OIDC Trusted Publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        # Build EXACTLY the two published distributions, by name. This used
        # to be `uv build --all-packages` (build every workspace member --
        # without it, a bare `uv build` only produces the `muxplex` sdist +
        # wheel and silently drops `muxplex-client`). That stopped being safe
        # at extraction stage S3: `lib/` (tmux_kit) is now a third workspace
        # member that is deliberately NOT published to PyPI (it rides
        # muxplex's git-based install; see lib/pyproject.toml and the plan's
        # scope) -- and a PyPI release cannot be unpublished. --all-packages
        # would put tmux_kit-* files in dist/ where the publish step uploads
        # everything it finds (and, per the note below, fail the whole job
        # with a 403 because tmux_kit has no trusted publisher). Explicit
        # --package flags keep any FUTURE workspace member unpublished by
        # default too, instead of published by accident.
        run: |
          uv build --package muxplex
          uv build --package muxplex-client

      - name: Preflight -- verify the built wheel resolves against the real index
        # THE GUARD FOR THE INCIDENT THIS WORKFLOW ALREADY CAUSED ONCE:
        # muxplex 0.44.0 published with `Requires-Dist: tmuxkit==0.44.0`,
        # a name/version that has never existed on PyPI -- every public
        # `pip install muxplex==0.44.0` has failed at resolve for the
        # release's entire life (yanked in response; see
        # docs/plans/2026-08-09-tmuxkit-own-repo-and-pypi-plan.md §0.1).
        # A PyPI release can never be unpublished, so this checks the
        # ACTUAL BUILT WHEEL's dependencies resolve against the REAL index
        # (the same one a real `pip install` would use) in a disposable
        # scratch venv, BEFORE the irreversible upload. `--dry-run` performs
        # full resolution without installing anything. If any pinned
        # dependency (tmux-kit, in the incident's case) cannot be resolved,
        # this step -- and therefore the whole job -- fails here, not
        # silently downstream on every user's machine.
        run: |
          uv venv /tmp/preflight-venv
          uv pip install --python /tmp/preflight-venv --dry-run dist/muxplex-*.whl
          uv pip install --python /tmp/preflight-venv --dry-run dist/muxplex_client-*.whl

      - name: Publish to PyPI
        # Uploads every file under dist/ (both muxplex-* and muxplex_client-*
        # artifacts) in one call. This works with OIDC Trusted Publishing only
        # because BOTH PyPI projects ("muxplex" and "muxplex-client") have a
        # trusted publisher registered for this exact repo/workflow/environment
        # triple -- each project's trust config is independent, and PyPI scopes
        # the minted token to every project whose config matches the OIDC
        # claims in this run, so one exchange covers both. If a future
        # workspace member's project name does NOT have its own trusted
        # publisher configured here, its files in dist/ will fail to upload
        # (403) even though the build step succeeds -- add the pending
        # publisher on PyPI before adding a new distribution to this workflow.
        uses: pypa/gh-action-pypi-publish@release/v1
