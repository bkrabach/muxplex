name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Tests against uv.lock's pinned versions -- a stable, reproducible dev
    # baseline. This is NOT a proxy for "what ships to users" -- see the
    # test-latest-deps job below for why a second job exists for that.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4  # checks out muxplex repo

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

  test-macos:
    # muxplex targets macOS, WSL, and Linux (README/AGENTS.md), but until now
    # every job in this workflow ran on ubuntu-latest -- zero macOS coverage.
    # That gap is not hypothetical: three consecutive releases shipped
    # macOS-only bugs found in production by a human, not CI --
    #   v0.31.1  `muxplex update` crashed with a raw `launchctl bootstrap`
    #            exit-5 traceback
    #   v0.31.2  `muxplex service restart` silently did nothing (a
    #            regression from the v0.31.1 fix itself)
    #   v0.31.3  `doctor` reported a tunnel as the local server
    # test_service.py already has thorough launchd coverage for the logic
    # (bootstrap retry, bootout race, already-loaded handling, etc.), but
    # every one of those tests mocks subprocess.run/create_subprocess_exec
    # and every darwin-specific test monkeypatches `sys.platform` --
    # v0.31.2's own changelog entry says this plainly: "these tests
    # exercise the logic, not launchctl... the real launchd behaviour is
    # verified by the shape of the calls, not by running them." Running
    # the identical suite on a real macOS runner does NOT change that --
    # launchctl calls stay mocked here too, and this job does not install a
    # real launchd job -- but it proves, for the first time, three things
    # the Linux-only matrix cannot:
    #   1. The dependency set (python-pam + its macOS-only `six` shim,
    #      cryptography, uvicorn[standard]'s compiled extras) actually
    #      resolves and imports on macOS/arm64, not just in theory.
    #   2. Every `sys.platform == "darwin"` branch (service.py, cli.py,
    #      cgroup_escape.py) executes for real at least once, instead of
    #      exclusively via `monkeypatch.setattr(sys, "platform", "darwin")`.
    #   3. test_tmux_config.py's `needs_tmux`-marked tests (managed tmux
    #      config install/uninstall/theme verification) run against a real
    #      tmux binary built for macOS, not only skip.
    #
    # Deliberately a SEPARATE job, not a matrix axis added to `test` above,
    # and deliberately ONE Python version, not the full 3.11/3.12/3.13
    # matrix: macos-latest runners are billed at a 10x multiplier against
    # Linux minutes and are measurably slower to provision, and the value
    # here is PLATFORM coverage (already zero), not additional Python
    # version coverage (already covered 3x on Linux by the `test` job).
    # Paying that multiplier three times over for a concern the Linux
    # matrix already owns would not be proportionate. 3.13 matches
    # test-latest-deps below and is the newest supported interpreter --
    # the version most representative of what a fresh `uv tool install
    # muxplex` resolves to today.
    #
    # macos-latest is Apple Silicon (arm64) on the GitHub-hosted image
    # generation this points to. That is the ONLY macOS architecture this
    # workflow exercises -- an Intel-only (x86_64) issue would still be
    # invisible here. Not adding a second, Intel-flavored macOS runner for
    # the same cost-proportionality reason as the Python-version matrix
    # above; revisit if an Intel-specific bug is ever reported.
    #
    # tmux is NOT preinstalled on GitHub's macOS runner image, so it's
    # installed via Homebrew below. Without that step, every
    # `needs_tmux`-marked test in test_tmux_config.py would silently SKIP
    # (an honest skip, not a failure -- see that file's own
    # `pytest.mark.skipif(not HAS_TMUX, ...)` guard) rather than actually
    # exercise real tmux behaviour on this platform, which would defeat
    # the point of adding this job at all.
    #
    # Not exercised here, and not claimed to be exercised: real
    # `launchctl`/launchd behaviour (installing an actual agent under a
    # CI runner's session is invasive and out of scope for this change),
    # and Homebrew-vs-apt tmux version drift. Both are explicitly the kind
    # of thing only a real run of this job -- not this comment -- can
    # confirm or refute.
    name: test (macOS, arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux (Homebrew) -- so needs_tmux tests exercise real tmux, not skip
        run: brew install tmux

      - name: Install ttyd (Homebrew) -- doctor()/dependency checks expect it on PATH
        run: brew install ttyd

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

  test-client:
    # muxplex-client (client/) is a separate uv workspace member and PyPI
    # distribution (see client/pyproject.toml, muxplex-client-design.md) with
    # its OWN pytest config (`testpaths = ["tests"]`, scoped to client/tests).
    # The `test` job above runs from the repo root, whose testpaths is
    # `["muxplex/tests"]` -- it NEVER collects client/tests, so the client's
    # 44 pure unit tests (test_protocol.py, test_sentinel.py) silently never
    # ran in CI. This is the same shape of blind spot `test-frontend` closed
    # for the JS suite: a real, dedicated test suite that nothing executed.
    #
    # A dedicated job (not a widened root `testpaths`) is deliberate:
    # - Keeps each package's pytest config authoritative for its own tests
    #   (root `addopts = "-m 'not integration'"` and the `integration`
    #   marker are muxplex-server concerns; the client suite is pure/networkless
    #   and has no markers of its own -- mixing configs would couple them for
    #   no benefit).
    # - Mirrors `test-frontend`'s pattern: one job per distribution/ecosystem,
    #   named for what it covers, independently green/red in the Actions UI.
    # - Orthogonal to `test-latest-deps`: that job exists to catch dependency
    #   *resolution* drift between `uv.lock` and a fresh `uv tool install`-style
    #   resolve for the SERVER's heavier dependency set (fastapi/uvicorn/etc).
    #   The client's only dependency is `httpx`, resolved from the same
    #   `uv sync` as this job already uses -- there is no comparable drift
    #   surface here, so this job runs against `uv.lock` only, same as `test`.
    #
    # Matrixed across the same Python versions as `test` because
    # muxplex-client is itself a published PyPI package supporting 3.11-3.13
    # (see client/pyproject.toml's classifiers) -- its own compatibility
    # promise, independent of the server's.
    name: test (muxplex-client package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (workspace sync, includes client/)
        run: uv sync --extra dev

      - name: Run muxplex-client tests
        run: uv run --directory client pytest -v

  test-latest-deps:
    # Real incident this closes (2026-07): uv.lock pinned uvicorn 0.42.0 /
    # websockets 16.0 (uvicorn's legacy websocket ASGI implementation), so
    # this job's sibling above -- and the DTU, which also installs from
    # uv.lock -- stayed green. Every real `uv tool install muxplex` (how
    # this project is actually shipped and installed) does NOT read
    # uv.lock at all: it re-resolves against pyproject.toml's version
    # floors and picks whatever is newest on PyPI, which resolved uvicorn
    # 0.51.0 / websockets 16.1.1 (the newer 'sansio' ASGI implementation).
    # A WebSocket RuntimeError reproduced ONLY on the sansio impl, so CI
    # and the DTU were both green while production threw it hourly for a
    # full day before anyone traced it to the version split.
    #
    # This job installs the same way `uv tool install` does -- a fresh
    # resolution with NO lock file involved -- so that class of drift is
    # caught here instead of discovered in production. Do not "simplify"
    # this into `uv sync`; that reintroduces exactly the blind spot above.
    # One Python version is enough (the point is catching dependency
    # drift, not re-running the full version matrix); see AGENTS.md ->
    # "Testing & workflow" for the full incident writeup.
    name: test (latest resolvable deps, mirrors `uv tool install`)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (fresh resolve, no lock -- mirrors `uv tool install`)
        run: |
          uv venv .venv-latest --python 3.13
          uv pip install --python .venv-latest/bin/python -e ".[dev]"
          .venv-latest/bin/python -c "import uvicorn, websockets; print('uvicorn', uvicorn.__version__); print('websockets', websockets.__version__)"

      - name: Run tests
        run: .venv-latest/bin/python -m pytest -v

  test-frontend:
    # The two Python jobs above never execute a line of frontend code. All PWA
    # logic lives in muxplex/frontend/ (app.js, terminal.js) and is covered by
    # node:test suites under muxplex/frontend/tests/ -- which, until this job
    # existed, ran ONLY when a human remembered to run them by hand.
    #
    # Concrete gap this closes (v0.15.1): a frontend-only fix shipped with a
    # new regression test, and CI went green across all four Python jobs
    # without ever executing that test. Same shape as the uv.lock drift that
    # test-latest-deps exists to catch -- CI green while not testing the thing
    # that actually changed.
    #
    # The glob is deliberate. `node --test tests/*.mjs` picks up every suite in
    # the directory, so a newly added suite is covered the moment it lands
    # rather than whenever someone remembers to list it here. It also fixes a
    # silent gap in the previously-documented command
    # (`node --test frontend/tests/test_app.mjs`), which named one file and so
    # never ran test_terminal.mjs at all.
    #
    # No install step and no package.json by design: these suites have zero
    # package dependencies and use only node: builtins.
    name: test (frontend, node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        working-directory: muxplex/frontend
        run: node --test tests/*.mjs

  test-integration:
    # Everything above deselects `-m integration` (pyproject.toml's
    # addopts = "-m 'not integration'"), so this ~52-test suite -- real
    # tmux servers, real ttyd processes, real AF_UNIX sockets, a real
    # in-process ASGI server -- had NEVER run in CI. That is not a
    # hypothetical gap: one of these tests was found this session building
    # a "fake" pid via `hash(name) % 50000 + N` and feeding it to a REAL,
    # unmocked `os.kill()` -- CPython's per-process hash randomization
    # means that expression is a different real integer every run, so an
    # unlucky one could (and, per test_ttyd.py's own incident notes, did)
    # sometimes resolve to a live, unrelated process. A suite nothing runs
    # is a suite that rots into a hazard silently -- fixed in the same
    # change that adds this job (see test_ttyd.py's `_FAKE_PID_*` constants
    # and their docstring for the fix), but the fact that CI never ran any
    # of this to catch it is the actual root cause, and is what this job
    # closes.
    #
    # A dedicated job, not a matrix axis on `test` above: these tests need
    # a REAL tmux/ttyd on PATH (the `test` job's ubuntu-latest image does
    # not guarantee either), take meaningfully longer (real subprocess
    # spawns, real socket readiness polls, ~1s `asyncio.sleep`s for bell
    # propagation) than the mocked unit suite, and a failure here is a
    # different signal (real-process/OS-integration regression) than a
    # failure in `test` (logic regression) -- worth its own red/green in
    # the Actions UI rather than blended into the matrix.
    #
    # Linux-only, deliberately not added to `test-macos` above. This is a
    # stated gap, not a silent omission: most of this suite's fixtures
    # build their tmux `TMUX_TMPDIR` directory from pytest's own `tmp_path`
    # rather than this repo's `short_socket_dir` pattern (conftest.py) --
    # e.g. test_command_pairs_integration.py's `pairs_env` fixture. That is
    # exactly the class of failure conftest.py's own `short_socket_dir`
    # docstring documents already breaking a DIFFERENT suite
    # (test_tmux_config.py, 12 failures) on macOS CI, because `tmp_path`
    # resolves to a long, deeply-nested path there
    # (/private/var/folders/.../pytest-.../<test>0/...) that blows past the
    # ~104-byte AF_UNIX `sun_path` budget once a socket filename is
    # appended. test_integration.py's own `use_tmp_state` fixture already
    # flags this directly: "Currently only reachable via `pytest -m
    # integration`, which the macOS CI job does not run -- but the
    # fragility is real the moment it does." No macOS runner was available
    # to verify empirically in this change, so rather than claim untested
    # macOS coverage, this job stays Linux-only until the fixtures that
    # build sockets from `tmp_path` are migrated to `short_socket_dir` (or
    # an equivalent short-path pattern) and someone can actually prove it
    # green on macOS.
    name: test (integration, real tmux/ttyd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux, lsof, ttyd -- real binaries these tests exercise directly
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux lsof ttyd

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        run: uv run pytest -m integration -v
        run: node --test tests/*.mjs
